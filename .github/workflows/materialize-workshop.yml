name: Materialize workshop specification

on:
  push:
    branches:
      - feat/open-vocabulary-detection-counting-workshop

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/open-vocabulary-detection-counting-workshop
      - name: Materialize exact uploaded specification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          root = Path(".")
          payload = (root / ".tmp/workshop-spec.b64").read_text()
          data = gzip.decompress(base64.b64decode(payload))
          expected_sha = "e6fbb0da9d1f16f49883696b3b54792605faecd3a6182616bd9c5c546b79577e"
          actual_sha = hashlib.sha256(data).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f"SHA mismatch: {actual_sha}")
          if len(data) != 39244:
              raise SystemExit(f"size mismatch: {len(data)}")
          out = root / "docs/open-vocabulary-detection-and-counting-workshop-spec.md"
          out.write_bytes(data)
          print(out, len(data), actual_sha)
          PY
      - name: Commit materialized specification
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/open-vocabulary-detection-and-counting-workshop-spec.md
          git rm .tmp/workshop-spec.b64
          git commit -m "docs: add open-vocabulary detection and counting workshop spec"
          git push
